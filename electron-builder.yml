appId: com.kolcrooks.krt
productName: KRT
copyright: Copyright (c) 2026 Kol Crooks
artifactName: ${productName}-${version}-mac-${arch}.${ext}

directories:
  output: release

files:
  - dist/renderer/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json

asar: true
# The bundled ripgrep binary must live outside the asar archive so it stays
# executable at runtime. Covers every @vscode/ripgrep platform sub-package.
asarUnpack:
  - node_modules/@vscode/ripgrep-*/bin/**

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

afterSign: build/notarize.cjs
