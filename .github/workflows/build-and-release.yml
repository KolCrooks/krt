name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-commits:
    name: Collect commits
    runs-on: ubuntu-latest
    outputs:
      shas: ${{ steps.commits.outputs.shas }}
    steps:
      - name: Collect pushed commit SHAs
        id: commits
        shell: bash
        env:
          EVENT_COMMITS: ${{ toJSON(github.event.commits.*.id) }}
        run: |
          shas="$(jq -c . <<< "$EVENT_COMMITS")"

          if [[ "$shas" == "[]" || "$shas" == "null" ]]; then
            shas="$(jq -cn --arg sha "$GITHUB_SHA" '[$sha]')"
          fi

          echo "shas=$shas" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build and release ${{ matrix.commit }}
    needs: collect-commits
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        commit: ${{ fromJSON(needs.collect-commits.outputs.shas) }}
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS release artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Publish GitHub release
        shell: bash
        env:
          COMMIT_SHA: ${{ matrix.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          short_sha="${COMMIT_SHA:0:7}"
          version="$(node -p "require('./package.json').version")"
          tag="main-${COMMIT_SHA}"
          title="KRT ${version} (${short_sha})"
          notes="Automated build for commit ${COMMIT_SHA} on main."

          shopt -s nullglob
          artifacts=(release/*.dmg release/*.zip release/*.yml release/*.blockmap)

          if [[ "${#artifacts[@]}" -eq 0 ]]; then
            echo "No release artifacts were created in release/."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${artifacts[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" "${artifacts[@]}" \
              --target "$COMMIT_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
